<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王乐江 - 个人简历</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a365d;
            --accent: #c9a227;
            --accent-light: #e8c547;
            --bg: #f7f8fa;
            --text: #2d3748;
            --text-light: #718096;
            --white: #ffffff;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            padding: 40px 20px;
        }

        .resume {
            max-width: 900px;
            margin: 0 auto;
            background: var(--white);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            border-radius: 4px;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, #2c5282 100%);
            color: var(--white);
            padding: 50px 50px 40px;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--accent);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-left h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .header-left .subtitle {
            font-size: 1.1rem;
            color: var(--accent-light);
            font-weight: 400;
            letter-spacing: 2px;
        }

        .header-contact {
            text-align: right;
        }

        .header-contact p {
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: rgba(255,255,255,0.9);
        }

        .header-contact a {
            color: var(--white);
            text-decoration: none;
        }

        .header-contact a:hover {
            color: var(--accent-light);
        }

        /* Body */
        .body {
            display: flex;
        }

        /* Left Column */
        .left-col {
            width: 280px;
            background: var(--bg);
            padding: 35px 25px;
            border-right: 1px solid var(--border);
        }

        .section {
            margin-bottom: 30px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent);
        }

        .section-content {
            font-size: 0.9rem;
            color: var(--text);
            line-height: 1.8;
        }

        .section-content p {
            margin-bottom: 8px;
        }

        .section-content ul {
            list-style: none;
        }

        .section-content li {
            position: relative;
            padding-left: 15px;
            margin-bottom: 6px;
        }

        .section-content li::before {
            content: '▪';
            position: absolute;
            left: 0;
            color: var(--accent);
            font-size: 0.7rem;
        }

        /* Right Column */
        .right-col {
            flex: 1;
            padding: 35px 40px;
        }

        .right-section {
            margin-bottom: 30px;
        }

        .right-section:last-child {
            margin-bottom: 0;
        }

        .right-section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .right-section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--accent);
            border-radius: 2px;
        }

        .right-section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
            margin-left: 10px;
        }

        /* Education Item */
        .education-item {
            margin-bottom: 18px;
        }

        .education-item:last-child {
            margin-bottom: 0;
        }

        .education-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 5px;
        }

        .education-school {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text);
        }

        .education-time {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .education-major {
            font-size: 0.9rem;
            color: var(--text-light);
        }

        /* Project Item */
        .project-item {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--border);
        }

        .project-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .project-name {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 6px;
        }

        .project-desc {
            font-size: 0.9rem;
            color: var(--text-light);
            line-height: 1.7;
        }

        /* Skills Grid */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .skill-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--bg);
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .skill-name {
            font-size: 0.88rem;
            font-weight: 500;
        }

        .skill-stars {
            color: var(--accent);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* Mobile */
        @media (max-width: 768px) {
            body {
                padding: 20px 15px;
            }

            .header {
                padding: 35px 25px 30px;
            }

            .header-content {
                flex-direction: column;
                gap: 25px;
            }

            .header-contact {
                text-align: left;
            }

            .header-left h1 {
                font-size: 2rem;
            }

            .body {
                flex-direction: column;
            }

            .left-col {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 25px 20px;
            }

            .right-col {
                padding: 25px 20px;
            }

            .skills-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Print */
        @media print {
            body {
                padding: 0;
                background: white;
            }
            .resume {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="resume">
        <header class="header">
            <div class="header-content">
                <div class="header-left">
                    <h1>王乐江</h1>
                    <p class="subtitle">Java开发工程师</p>
                </div>
                <div class="header-contact">
                    <p><a href="mailto:wlj_20001028@163.com">wlj_20001028@163.com</a></p>
                    <p>181-8142-6695</p>
                    <p>四川成都</p>
                </div>
            </div>
        </header>

        <div class="body">
            <aside class="left-col">
                <div class="section">
                    <h3 class="section-title">教育背景</h3>
                    <div class="section-content">
                        <p><strong>四川大学锦江学院</strong></p>
                        <p>本科 · 计算机科学与技术</p>
                        <p>2021.09 - 2025.06</p>
                    </div>
                </div>

                <div class="section">
                    <h3 class="section-title">专业技能</h3>
                    <div class="section-content">
                        <ul>
                            <li>Java</li>
                            <li>Spring Boot</li>
                            <li>MySQL</li>
                            <li>Redis</li>
                            <li>HTML/CSS/JS</li>
                            <li>Vue</li>
                            <li>Git</li>
                            <li>Linux</li>
                        </ul>
                    </div>
                </div>
            </aside>

            <main class="right-col">
                <section class="right-section">
                    <h2 class="right-section-title">项目经历</h2>

                    <div class="project-item">
                        <h3 class="project-name">在线OJ判题系统</h3>
                        <p class="project-desc">前后端分离判题系统，支持用户注册登录、题库管理、在线编程、提交判题</p>
                    </div>

                    <div class="project-item">
                        <h3 class="project-name">图书借阅管理系统</h3>
                        <p class="project-desc">前后端分离管理系统，支持图书管理、用户管理、借阅管理、图书检索</p>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
