<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王乐江 - 简历</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #64748b;
            --accent: #3b82f6;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* Markdown Content Styles */
        .resume-content {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 2.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .resume-content h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 3px solid var(--primary);
        }

        .resume-content h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary);
            margin-top: 2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border);
        }

        .resume-content h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .resume-content p {
            margin-bottom: 0.75rem;
            color: var(--text);
        }

        .resume-content ul {
            list-style: none;
            margin-bottom: 1rem;
        }

        .resume-content li {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .resume-content li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
        }

        .resume-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }

        .resume-content th,
        .resume-content td {
            border: 1px solid var(--border);
            padding: 0.75rem;
            text-align: left;
        }

        .resume-content th {
            background: var(--bg);
            font-weight: 600;
        }

        .resume-content a {
            color: var(--primary);
            text-decoration: none;
        }

        .resume-content a:hover {
            text-decoration: underline;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--secondary);
        }

        .error {
            text-align: center;
            padding: 3rem;
            color: #dc2626;
            background: #fef2f2;
            border-radius: 1rem;
        }

        /* Mobile */
        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }
            .resume-content {
                padding: 1.5rem;
            }
            .resume-content h1 {
                font-size: 1.75rem;
            }
        }

        /* Print */
        @media print {
            body {
                background: white;
            }
            .resume-content {
                box-shadow: none;
                border: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="app" class="loading">加载中...</div>
    </div>

    <script>
        async function loadResume() {
            const app = document.getElementById('app');
            try {
                const res = await fetch('resume.md');
                if (!res.ok) {
                    throw new Error('简历文件加载失败');
                }
                const md = await res.text();
                const html = marked.parse(md);
                app.innerHTML = `<div class="resume-content">${html}</div>`;
            } catch (err) {
                app.innerHTML = `<div class="error">加载失败: ${err.message}<br>请确保已正确配置GitHub Pages</div>`;
            }
        }
        loadResume();
    </script>
</body>
</html>
